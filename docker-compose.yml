version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: luandagov_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: luandagov
      POSTGRES_PASSWORD: luandagov_secret
      POSTGRES_DB: luandagov
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luandagov"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: luandagov_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luandagov_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://luandagov:luandagov_secret@db/luandagov
      REDIS_URL: redis://redis:6379
      SECRET_KEY: change-this-to-a-real-secret-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
